name: photo_tracker
description: "Location-based photo tracking mobile app - GeoTagging CRM"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cached_network_image: ^3.3.0
  connectivity_plus: ^5.0.0
  dio: ^5.3.0
  flutter_animate: ^4.2.0
  flutter_map: ^6.0.0
  flutter_riverpod: ^2.4.0
  flutter_svg: ^2.0.0
  geocoding: ^2.1.0
  geolocator: ^10.1.0
  go_router: ^12.0.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  image_picker: ^1.0.0
  intl: ^0.19.0
  json_annotation: ^4.9.0
  json_serializable: ^6.7.0
  latlong2: ^0.9.0
  logger: ^2.1.0
  lottie: ^2.7.0
  path_provider: ^2.1.0
  permission_handler: ^11.4.0
  share_plus: ^9.0.0
  retrofit: ^4.9.2
  riverpod: ^2.4.0
  riverpod_generator: ^2.3.0
  shared_preferences: ^2.2.0
  shimmer: ^3.0.0
  uuid: ^4.0.0

dev_dependencies:
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/images/app_icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/icons/
    - assets/images/
